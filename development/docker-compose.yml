---
volumes:
  media_root:
services:
  nautobot:
    build:
      args:
        PYTHON_VER: "${PYTHON_VER}"
      context: ../
      dockerfile: docker/Dockerfile
      target: dev
    healthcheck:
      start_period: 10m
    image: "local/nautobot-dev:local-${NAUTOBOT_VER}-py${PYTHON_VER}"
    ports:
      - "8080:8080"
    volumes:
      - media_root:/opt/nautobot/media
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    env_file:
      - dev.env
    init: true
    tty: true
  celery_worker:
    image: "local/nautobot-dev:local-${NAUTOBOT_VER}-py${PYTHON_VER}"
    ports:
      - "8081:8080"
    volumes:
      - media_root:/opt/nautobot/media
    entrypoint: "watchmedo auto-restart --directory './' --pattern '*.py' --recursive -- nautobot-server celery worker -l INFO --events"
    healthcheck:
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
      test: "nautobot-server celery inspect ping --destination celery@$$HOSTNAME"
    depends_on:
      nautobot:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./dev.env
    tty: true
  celery_beat:
    image: "local/nautobot-dev:local-${NAUTOBOT_VER}-py${PYTHON_VER}"
    entrypoint: "watchmedo auto-restart --directory './' --pattern '*.py' --recursive -- nautobot-server celery beat -l INFO"
    healthcheck:
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 3
      # find the heartbeat file and report success if it was modified less than 0.1 minutes (6 seconds) ago, else fail
      test: "[ $$(find /tmp/nautobot_celery_beat_heartbeat -mmin -0.1 | wc -l) -eq 1 ] || false"
    depends_on:
      nautobot:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./dev.env
    tty: true
  procrastinate_scheduler:
    # Opt-in service. Start with: docker compose --profile procrastinate up procrastinate_scheduler
    # Equivalent to celery_beat for the Procrastinate path. Reads ScheduledJob
    # rows and enqueues due jobs via the active TaskBackend.
    profiles:
      - procrastinate
    image: "local/nautobot-dev:local-${NAUTOBOT_VER}-py${PYTHON_VER}"
    entrypoint: "watchmedo auto-restart --directory './' --pattern '*.py' --recursive -- nautobot-server nautobot_scheduler"
    healthcheck:
      disable: true
    depends_on:
      nautobot:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      NAUTOBOT_TASK_BACKEND: procrastinate
    env_file:
      - ./dev.env
    tty: true
  procrastinate_worker:
    # Opt-in service. Start with: docker compose --profile procrastinate up procrastinate_worker
    # or: invoke start (with COMPOSE_PROFILES=procrastinate in the environment).
    # This service is the Procrastinate equivalent of celery_worker. It is safe
    # to leave celery_worker running alongside; tasks are routed to one backend
    # only based on NAUTOBOT_TASK_BACKEND.
    profiles:
      - procrastinate
    image: "local/nautobot-dev:local-${NAUTOBOT_VER}-py${PYTHON_VER}"
    entrypoint: "watchmedo auto-restart --directory './' --pattern '*.py' --recursive -- nautobot-server procrastinate worker"
    healthcheck:
      disable: true  # procrastinate has no built-in ping; rely on logs for now
    depends_on:
      nautobot:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      NAUTOBOT_TASK_BACKEND: procrastinate
    env_file:
      - ./dev.env
    tty: true
  redis:
    image: redis:6-alpine
    command:
      - sh
      - -c # this is to evaluate the $REDIS_PASSWORD from the env
      - redis-server --appendonly yes --requirepass $$REDIS_PASSWORD ## $$ because of docker-compose
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 3
      test: "redis-cli -h localhost ping | grep PONG"
    env_file:
      - ./dev.env
  selenium:
    profiles:
      - selenium
    image: selenium/standalone-firefox:4.27
    ports:
        - "4444:4444"
        - "15900:5900"
    shm_size: 2g
  mkdocs:
    profiles:
      - mkdocs
    image: "local/nautobot-dev:local-${NAUTOBOT_VER}-py${PYTHON_VER}"
    entrypoint: "mkdocs serve --livereload -a '0.0.0.0:8001'"
    healthcheck:
      disable: true
    tty: true
    ports:
      - "8001:8001"
